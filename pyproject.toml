[project]
name = "apigrunn-archiver"
version = "0.1.0"
description = "Versioned local archive of the aiGrunn conference website, one snapshot per run."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ email = "jaap@evoso.nl" }]
keywords = ["apigrunn", "aigrunn", "archive", "conference", "scraper"]
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[project.urls]
Homepage = "https://www.aigrunn.org/"

[project.scripts]
apigrunn-archiver = "apigrunn_archiver.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apigrunn_archiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: test hits the live aigrunn.org site"]
